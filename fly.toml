# ============================================================
# Fly.io — configuration de déploiement du jeu
# Étapes (voir README → Mise en production) :
#   fly launch --no-deploy            (puis renseigner le nom de l'app)
#   fly volumes create jeu_data --size 1
#   fly secrets set ADMIN_PASSWORD=... ADMIN_SECRET=...
#   fly deploy
# ============================================================
app = "mister-coque-jeu"
primary_region = "cdg"

[env]
  PORT = "8000"
  NODE_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true

[[mounts]]
  source = "jeu_data"
  destination = "/app/data"
