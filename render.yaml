# ============================================================
# Render — Blueprint de déploiement du jeu (web service gratuit)
# Déploiement : render.com → New → Blueprint → choisir ce dépôt → Apply
# ============================================================
services:
  - type: web
    name: mister-coque-jeu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
